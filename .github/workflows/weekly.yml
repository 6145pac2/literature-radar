name: Weekly Literature Radar

# 定时板块：每周一 UTC 01:30（北京时间 09:30）运行，也允许网页手动触发。
on:
  schedule:
    - cron: '30 1 * * 1' # UTC 01:30 = Beijing 09:30
  workflow_dispatch:

# 权限板块：写回周报文件，并使用 GitHub Pages 官方部署方式发布公开归档。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      # 三个真实凭据保存在仓库 Settings → Secrets and variables → Actions 中。
      EMAIL_AUTHORIZATION_CODE: ${{ secrets.EMAIL_AUTHORIZATION_CODE }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      # 环境准备：下载代码、安装 Python 3.11 和项目依赖。
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run literature radar
        run: python src/main.py
      # Pages 只包含索引和周报，绝不把含凭据的 config.yaml 放入公开站点。
      - name: Prepare public archive
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R reports _site/reports
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Commit and push generated files
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先提交本地输出，再 rebase；否则 Git 会拒绝在脏工作区执行 pull --rebase。
          git add reports/ logs/ history.json index.html
          git diff --staged --quiet || git commit -m "Weekly report $(date +'%Y-%m-%d')"
          if ! git pull --rebase; then
            echo "::error::Git pull --rebase failed; generated files were not pushed"
            git rebase --abort || true
            exit 0
          fi
          if ! git push; then
            echo "::error::Git push failed; email was already sent"
          fi

  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
